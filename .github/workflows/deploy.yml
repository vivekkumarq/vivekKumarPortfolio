name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BASE_HREF must match the path the site is served from, or every
      # asset 404s. Set as a repository variable under
      # Settings -> Secrets and variables -> Actions -> Variables.
      #   project site (current)  ->  /vivekKumarPortfolio/
      #   user site               ->  /
      #   custom domain (CNAME)   ->  /
      - name: Build
        run: npm run build -- --base-href "${{ vars.BASE_HREF || '/' }}"

      # Stops GitHub Pages running the output through Jekyll, which would
      # drop any file or folder whose name starts with an underscore.
      - name: Add .nojekyll
        run: touch dist/vivek-portfolio/browser/.nojekyll

      # Single-page site: serve the prerendered page for unknown paths too,
      # so a stale or mistyped deep link still lands somewhere useful.
      - name: Add 404 fallback
        run: cp dist/vivek-portfolio/browser/index.html dist/vivek-portfolio/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vivek-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
