<!doctype html>
<html lang="en" data-theme="dark" data-font="sans">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fallback title/description. The real values are set from
         src/app/core/profile.ts via the SeoService and are baked into the
         prerendered HTML at build time. -->
    <title>Vivek Kumar — Software Engineer</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces carries an optical-size axis (9..144). Browsers apply
         font-optical-sizing: auto by default, so the hero picks up the
         display cut and the smaller headings the text cut, automatically. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Fraunces:opsz,wght@9..144,100..900&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&family=Nunito:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- The scroll-reveal directive ships its class in the prerendered HTML,
         which starts at opacity 0 and is only revealed by an
         IntersectionObserver. Without this, a visitor with JavaScript
         disabled — or a crawler that does not execute it — gets a blank
         page even though all the content is right there in the markup. -->
    <noscript>
      <style>
        .u-reveal {
          opacity: 1 !important;
          transform: none !important;
        }
        /* Without JS the experience view toggle can't run — open every
           collapsed block so all content stays reachable. */
        .u-collapse {
          grid-template-rows: 1fr !important;
        }
      </style>
    </noscript>

    <!-- Applied before first paint so neither the chosen theme nor the
         chosen typography style ever flashes its default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vk-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var f = localStorage.getItem('vk-font');
          document.documentElement.setAttribute(
            'data-font',
            ['grotesk', 'mono', 'serif', 'rounded'].indexOf(f) >= 0 ? f : 'sans'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-font', 'sans');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
